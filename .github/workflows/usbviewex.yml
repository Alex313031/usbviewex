name: Build USBViewEx

on:
  workflow_dispatch:

# Least privilege: only checkout needs the token. Artifact upload uses the
# runtime token, not GITHUB_TOKEN scopes. The publish job alone widens this to
# contents:write, to roll the ci-build prerelease.
permissions:
  contents: read

# Update MinGW version here
env:
  MINGW_BASE_URL: https://github.com/Alex313031/mingw-build/releases/download/20261108

jobs:
  build:
    name: MinGW Build x86/x64
    # Cross-compiled on Linux with our own MinGW fork, which still targets
    # legacy Windows. The .exe files are statically linked PE binaries with
    # the legacy baseline (PE subsystem 5.0 on x86, 5.2 on x64), independent of
    # the runner they were built on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # So the publish job can name the assets without parsing src/version.h a
    # second time.
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y make binutils wget zip unzip

      - name: Download Custom MinGW
        # Use our own MinGW fork for compiling Windows builds.
        # Each zip unpacks to a dir named after its target arch (i686/, x64/).
        run: |
          for arch in i686 x64; do
            wget "${MINGW_BASE_URL}/mingw_gcc_linux_${arch}.zip"
            unzip -o "mingw_gcc_linux_${arch}.zip" -d "$HOME"
            rm -f "mingw_gcc_linux_${arch}.zip"
          done
          # Fail fast if either cross-compiler can't run on this host.
          "$HOME/i686/bin/i686-w64-mingw32-gcc" --version
          "$HOME/x64/bin/x86_64-w64-mingw32-gcc" --version
          echo "$HOME/x64/bin" >> "$GITHUB_PATH"
          echo "$HOME/i686/bin" >> "$GITHUB_PATH"

      # Release builds from the GNUmakefile, one per toolchain prefix.
      - name: Build x86
        # Output: out/mingw/x86/Release/usbview.exe
        run: |
          make CROSS=i686-w64-mingw32-

      - name: Build x64
        # Output: out/mingw/x64/Release/usbview.exe
        run: |
          make CROSS=x86_64-w64-mingw32-

      - name: Check Binaries
        # The whole point of building with this toolchain is that the result
        # starts on Windows 2000/XP, so fail the run if the PE header says
        # otherwise instead of finding out on an old machine.
        run: |
          check() {  # check <exe> <machine> <subsystem minor version>
            local headers
            headers=$(x86_64-w64-mingw32-objdump -p "$1")
            echo "$1:"
            echo "$headers" | grep -E 'file format|MajorSubsystemVersion|MinorSubsystemVersion|DLL Name'
            echo "$headers" | grep -q "file format $2" \
              || { echo "::error::$1 is not $2"; return 1; }
            echo "$headers" | grep -Eq 'MajorSubsystemVersion[[:space:]]+5$' \
              || { echo "::error::$1 subsystem major version is not 5"; return 1; }
            echo "$headers" | grep -Eq "MinorSubsystemVersion[[:space:]]+$3\$" \
              || { echo "::error::$1 subsystem minor version is not $3"; return 1; }
          }
          check out/mingw/x86/Release/usbview.exe pei-i386 0
          check out/mingw/x64/Release/usbview.exe pei-x86-64 2

      - name: Package .zips
        id: package
        # One zip per architecture, named usbviewex_<version>_<arch>.zip, each
        # holding usbview.exe, LICENSE.md and usbview.html at the top level.
        # The version comes from src/version.h so it cannot drift from the exe.
        # The short commit SHA goes into the artifact name.
        run: |
          ver() { sed -n "s/^#define USBVIEW_$1_VERSION[[:space:]]*\([0-9][0-9]*\).*/\1/p" src/version.h; }
          VERSION="$(ver MAJOR).$(ver MINOR).$(ver BUILD)"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Could not read the version from src/version.h (got '$VERSION')"; exit 1 ;;
          esac
          for arch in x86 x64; do
            zip -j "usbviewex_${VERSION}_${arch}.zip" \
              "out/mingw/${arch}/Release/usbview.exe" LICENSE.md src/usbview.html
            unzip -l "usbviewex_${VERSION}_${arch}.zip"
          done
          SHA=${{ github.sha }}
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "SHA_SHORT=${SHA:0:6}" >> "$GITHUB_ENV"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usbviewex_${{ env.VERSION }}_${{ env.SHA_SHORT }}
          path: usbviewex_*.zip
          if-no-files-found: error

  # Roll the ci-build prerelease, so the newest successful build of main is
  # always downloadable without digging through the Actions tab. One release
  # and one lower-case ci-build tag, deleted and recreated each time so the tag
  # always points at the commit its assets were built from.
  #
  # This workflow is workflow_dispatch only, so ci-build moves when someone
  # asks for a build, not on every push, and can lag main. Runs from other
  # branches still build and upload the artifact, but do not publish.
  publish:
    name: Publish ci-build
    needs: build
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # For git log, which goes into the release notes.
      - name: Checkout
        uses: actions/checkout@v4

      # The artifact holds the two zips with their final names, so what gets
      # published is byte-for-byte what the build job checked.
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: usbviewex_*
          merge-multiple: true

      - name: Check Release Files
        env:
          VER: ${{ needs.build.outputs.version }}
        run: |
          ls -la dist
          for arch in x86 x64; do
            if [ ! -f "dist/usbviewex_${VER}_${arch}.zip" ]; then
              echo "::error::dist/usbviewex_${VER}_${arch}.zip is missing from the build job's artifact"
              exit 1
            fi
          done

      - name: Roll ci-build Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          # Header, then the full commit message.
          {
            echo "Automated build of USBViewEx $VER at commit ${{ github.sha }}"
            echo
            echo "Built with MinGW from the GNUmakefile. The 32-bit build runs on"
            echo "Windows 2000 and up, the 64-bit build on XP x64 / Server 2003 and up."
            echo
            echo "| Asset | What it is |"
            echo "|---|---|"
            echo "| \`usbviewex_${VER}_x86.zip\` | 32-bit build |"
            echo "| \`usbviewex_${VER}_x64.zip\` | 64-bit build |"
            echo
            echo "A prerelease, and rolling: this tag is deleted and recreated by"
            echo "every successful build of main, so treat it as the current state"
            echo "of the tree, not as a version."
            echo
            echo "----"
            git log -1 --format='%B'
          } > release-notes.md
          # Delete the old release and its tag, then recreate at this commit so
          # the tag always points at what the assets were built from.
          gh release delete ci-build --cleanup-tag --yes || true
          gh release create ci-build dist/* \
            --target "${{ github.sha }}" \
            --title "CI Build (latest)" \
            --prerelease \
            --notes-file release-notes.md
